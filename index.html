<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know Me</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <div class="card">

            <div class="logo">KNOW ME</div>

            <h1>How well do you<br>really know me?</h1>

            <p class="subtitle">
                Create your own 10-question quiz and find out
                how well your friends know you.
            </p>

            <div class="name-section">
                <label for="creatorName">Your Name</label>
                <input
                    type="text"
                    id="creatorName"
                    placeholder="Enter your name"
                    maxlength="30"
                >
            </div>

            <button id="createBtn">Create My Quiz</button>

            <p class="small-text">
                10 questions · 4 options each · One attempt per name
            </p>

        </div>
    </main>

    <footer>
        <p>Created by Savithuram</p>
        <p>For queries, doubts or fun ideas, contact Savithuram.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
